<!doctype html>
<html lang="it"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Messi · Browser QA</title>
<style>body{margin:0;font:16px/1.5 system-ui;color:#18202c;background:#edf1f7}header{padding:16px;display:flex;flex-wrap:wrap;align-items:center;gap:12px}label{display:flex;align-items:center;gap:8px}select,button{font:inherit;padding:8px;border:1px solid #8792a3;border-radius:8px;background:white}#stage{overflow:auto;padding:16px}iframe{display:block;height:844px;border:1px solid #8792a3;background:white;margin:auto}pre{padding:16px;white-space:pre-wrap;background:white;margin:16px}button{cursor:pointer}</style>
<header><strong>Browser QA</strong><label>Pagina <select id="page"><option value="index.html">Home</option><option value="carriera.html">Carriera</option><option value="trofei.html">Trofei</option><option value="record.html">Record</option><option value="argentina.html">Argentina</option><option value="credits.html">Crediti</option></select></label><label>Viewport <select id="width"><option>320</option><option selected>390</option><option>768</option><option>1440</option></select></label><label>Testo <select id="size"><option value="100">100%</option><option value="200">200%</option></select></label><button id="check">Verifica pagina</button><button id="all">Verifica tutte</button><button id="details">Verifica approfondimenti</button><label><input type="checkbox" id="no-kit">Senza kit esterno</label><label><input type="checkbox" id="no-js">Senza JavaScript</label></header>
<div id="stage"><iframe title="Sito Messi in verifica" src="../index.html" style="width:390px"></iframe></div><pre id="report" aria-live="polite">Caricamento…</pre>
<script src="https://cdn.jsdelivr.net/npm/axe-core@4.10.3/axe.min.js"></script>
<script>
const frame=document.querySelector('iframe'),report=document.querySelector('#report'),page=document.querySelector('#page'),width=document.querySelector('#width'),size=document.querySelector('#size');
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
function adapt(){frame.style.width=width.value+'px';frame.contentDocument.documentElement.style.fontSize=size.value+'%';frame.contentDocument.querySelectorAll('link[href^="https://aiuxplayground.com"]').forEach(l=>l.disabled=document.querySelector('#no-kit').checked)}
function load(file){return new Promise(resolve=>{frame.addEventListener('load',async()=>{adapt();await sleep(400);resolve()},{once:true});frame.src='../'+file})}
frame.addEventListener('load',()=>{adapt();report.textContent='Pagina pronta. Interagisci con il sito o avvia la verifica.'});
page.onchange=()=>load(page.value);document.querySelector('#no-kit').onchange=adapt;document.querySelector('#no-js').onchange=()=>{if(document.querySelector('#no-js').checked)frame.setAttribute('sandbox','allow-same-origin');else frame.removeAttribute('sandbox');load(page.value)};width.onchange=adapt;size.onchange=adapt;
async function check(){
 const doc=frame.contentDocument,win=frame.contentWindow,region=doc.querySelector('.screen-scroll'),nav=doc.querySelector('.ios-tabbar');
 const all=[...doc.querySelectorAll('.app-header *,main *,.ios-tabbar *')].filter(e=>e.getClientRects().length&&win.getComputedStyle(e).position!=='absolute');
 const overflow=all.filter(e=>{const r=e.getBoundingClientRect();return r.left<-.5||r.right>win.innerWidth+.5}).map(e=>e.tagName+'.'+e.className);
 const broken=[...doc.images].filter(i=>i.getClientRects().length&&i.complete&&!i.naturalWidth).map(i=>i.getAttribute('src'));
 const result={page:doc.title,viewport:win.innerWidth,text:size.value+'%',documentOverflow:doc.documentElement.scrollWidth>win.innerWidth,contentOverflow:region.scrollWidth>region.clientWidth,overflow,brokenImages:broken,navHeight:Math.round(nav.getBoundingClientRect().height),mainHeading:doc.querySelectorAll('h1').length,localResources:win.performance.getEntriesByType('resource').filter(e=>e.name.includes('/assets/')&&e.transferSize).length,domElements:doc.querySelectorAll('*').length};
 if(document.querySelector('#no-js').checked){result.accessibility='Not run in sandbox';return result} if(!win.axe){await new Promise((resolve,reject)=>{const script=doc.createElement('script');script.src='https://cdn.jsdelivr.net/npm/axe-core@4.10.3/axe.min.js';script.onload=resolve;script.onerror=reject;doc.head.append(script)})} if(win.axe){const a=await win.axe.run(doc,{runOnly:{type:'tag',values:['wcag2a','wcag2aa','wcag21aa','wcag22aa']}});result.accessibility=a.violations.map(v=>({id:v.id,impact:v.impact,nodes:v.nodes.map(n=>n.target)}));result.passes=a.passes.length}else result.accessibility='axe unavailable';
 return result;
}
document.querySelector('#check').onclick=async()=>{report.textContent='Verifica…';report.textContent=JSON.stringify(await check(),null,2)};
document.querySelector('#all').onclick=async()=>{try{const results=[];for(const w of ['320','390','768','1440']){width.value=w;for(const p of [...page.options]){page.value=p.value;report.textContent='Verifica '+p.text+' · '+w;await load(p.value);results.push(await check())}}report.textContent=JSON.stringify(results,null,2)}catch(error){report.textContent=error.stack}};

document.querySelector('#details').onclick=async()=>{try{const results=[];width.value='320';size.value='200';for(const p of [...page.options]){page.value=p.value;await load(p.value);const doc=frame.contentDocument;for(const detail of [...doc.querySelectorAll('details')]){report.textContent='Verifica '+p.text+' · '+detail.id;detail.querySelector('summary').click();await sleep(900);const r=await check();r.detail=detail.id;results.push(r)}}report.textContent=JSON.stringify(results,null,2)}catch(error){report.textContent=error.stack}};
</script></html>
